user hyphanet;

worker_processes auto;

pid /etc/nginx/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format ingress_debug
    '$remote_addr "$request" status=$status '
    'host="$http_host" ';

    sendfile on;
    
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $request_method $fproxy_content_length {
    default $http_content_length;
    GET     "";
    HEAD    "";
        
    }

    server {
        listen 80;
        server_name _;
        ##certfile##;
	    ##keyfile##;
	
        access_log /dev/stdout ingress_debug;
        location / {
            # 啟用基本認證
            ##auth_basic##
            ##auth_basic_user_file##
            proxy_pass http://127.0.0.1:8888;

            proxy_http_version 1.1;
            
            #proxy_set_header Content-Length $fproxy_content_length;
            #proxy_pass_request_headers off;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            #proxy_hide_header X-Frame-Options;
            #proxy_hide_header Content-Security-Policy;
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            #sub_filter "<head>"  '<head><base href="$http_x_ingress_path">' ;
            #proxy_set_header Accept-Encoding "";
            #sub_filter_types text/html text/css application/javascript text/javascript;
            #sub_filter_types *;
            #sub_filter_once off;
            #sub_filter '/static/' '$http_x_ingress_path/static/';
            #proxy_redirect ~^(/.*)$ https://$http_host$http_x_ingress_path$1;
            #add_header X-Debug-URI $request_uri always;
            #add_header X-Debug-Upstream-Status $upstream_status always;
            #add_header X-Debug-Upstream-Location $upstream_http_location always;
            #sub_filter '="/USK@' '="$http_x_ingress_path/USK@';
            #sub_filter '(/USK@' '($http_x_ingress_path/USK@';
            #sub_filter 'src="/' 'src="';
            #sub_filter 'href="/' 'href="';



        }
    }
}