user hyphanet;

worker_processes auto;

pid /etc/nginx/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format ingress_debug
    '$remote_addr "$request" status=$status '
    'host="$http_host" ';

    sendfile on;
    
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $request_method $fproxy_content_length {
    default $http_content_length;
    GET     "";
    HEAD    "";
        
    }
    #map $http_x_ingress_path $ingress_root {
    #""      "/";
    #default $http_x_ingress_path/;
    #}
    server {
        listen 8099;
        server_name _;
        access_log /dev/stdout ingress_debug;
        location / {
            proxy_pass http://127.0.0.1:8888;
            proxy_http_version 1.1;
            proxy_set_header Content-Length $fproxy_content_length;
            #proxy_pass_request_headers off;
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            #proxy_read_timeout 3600;
            #proxy_send_timeout 3600;
            
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            sub_filter_types *;
            sub_filter_once off;
            proxy_set_header Accept-Encoding "";
            sub_filter 'src="/' 'src="$http_x_ingress_path/';
            sub_filter 'href="/' 'href="$http_x_ingress_path/';
            sub_filter 'url("/' 'url("$http_x_ingress_path/';
            sub_filter 'action="/' 'action="$http_x_ingress_path/';
            
            #頁面進度條完成自動跳轉
            sub_filter 'URL=/' 'URL=$http_x_ingress_path/';
            sub_filter 'url=/' 'url=$http_x_ingress_path/';
            #proxy_redirect off;
            proxy_buffering off;
            
            proxy_redirect ~^(/.*)$ $http_x_forwarded_proto://$http_host$http_x_ingress_path$1;
            
            add_header X-Debug-URI $request_uri always;
            add_header X-Debug-Ingress $http_x_ingress_path always;
            add_header X-Debug-Upstream-Location $upstream_http_location always;
            add_header X-Debug-Host $http_host always;
            add_header X-Debug-scheme $scheme always;

            #修改wizard回應
            sub_filter 'window.location.replace("/wiz/ ")' 'window.location.replace("$http_x_ingress_path/wiz/")';

        }
        
    }
    server {
        listen 80;
        server_name _;
        ##certfile##;
	    ##keyfile##;
	
        access_log /dev/stdout ingress_debug;
        location / {
            # 啟用基本認證
            ##auth_basic##
            ##auth_basic_user_file##
            proxy_pass http://127.0.0.1:8888;

            proxy_http_version 1.1;
            
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;



        }
    }
}
