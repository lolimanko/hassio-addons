name: "Hyphanet"
version: 0.75.1507
slug: "hyphanet"
description: "Hyphanet is peer-to-peer network for
censorship-resistant and privacy-respecting
publishing and communication."
arch:
  - aarch64
  - amd64
init: false
ports:
  80/tcp: 8888
map:
  - type: addon_config
    read_only: false
    #path: /app/configs
  - type: media
    read_only: False
  - type: share
    read_only: false
  - type: ssl
    read_only: false
image: "ghcr.io/lolimanko/{arch}-hyphanet" 
ingress: true 
#ingress_stream: true
#ingress_port: 80
#panel_icon: mdi:television
options:
  http_auth: false
  ssl: false
  certfile: fullchain.pem
  keyfile: privkey.pem
schema:
  http_auth: bool
  auth_user: "str?"
  auth_pass: "str?"
  ssl: bool
  certfile: str
  keyfile: str
