name: "Tribler"
version: "0.2.1"
slug: tribler
description: "Tribler 匿名 P2P 下載器（headless + Web UI，支援側邊欄 Ingress）"
url: "https://github.com/Tribler/tribler"
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
# P2P / IPv8 / libtorrent 使用大量動態連接埠，host network 最省事
host_network: true
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:download-network
panel_title: Tribler
panel_admin: true
map:
  - media:rw
options:
  api_key: ""
  api_port: 8085
  expose_api: true
  download_dir: "/media/tribler"
schema:
  api_key: password
  api_port: port
  expose_api: bool
  download_dir: str
image: ghcr.io/lolimanko/{arch}-tribler