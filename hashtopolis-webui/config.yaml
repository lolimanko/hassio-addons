name: "hashtopolis-frontend"
description: "frontend"
version: "6.4"
slug: "hashtopolis-frontend"
#init: false
#host_network: true
ports:
  80/tcp: 4200
  443/tcp: 4201
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
map:
  - type: ssl
    read_only: False
  - type: media
    read_only: False
  - type: share
    read_only: false
ingress: true 
#ingress_port: 80
#image: "redroid/redroid" 
options:
  hashtopolis_backend_url:
  SSL: false
schema:
  hashtopolis_backend_url: str
  SSL: bool

